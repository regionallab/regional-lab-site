<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Regional Lab — 彩 Direction</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Zen+Old+Mincho:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #ecebe6; font-family: "Inter", system-ui, sans-serif; }
  #root { width: 100vw; height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#1f3552"/>
    <text x="300" y="220" text-anchor="middle" font-family="serif" font-size="180" fill="#f1ead8" font-weight="500">彩</text>
    <text x="300" y="290" text-anchor="middle" font-family="serif" font-size="22" fill="#9a3324" letter-spacing="6">REGIONAL LAB</text>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="variant-b-sai.jsx"></script>
<script type="text/babel" src="variant-b-pages.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, SaiVariant, SaiAbout, SaiCompany, SaiNews, SaiPartners } = window;

function App() {
  return (
    <DesignCanvas
      title="Regional Lab — 彩 / Layered Washi"
      subtitle="ホーム + 5サブページ / 1440px hi-fi コーポレートサイト"
    >
      <DCSection id="home" title="Home">
        <DCArtboard id="home" label="Home — トップページ" width={1440} height={3400}>
          <SaiVariant />
        </DCArtboard>
      </DCSection>

      <DCSection id="pages" title="Sub Pages">
        <DCArtboard id="about" label="01 / 私たちについて" width={1440} height={2200}>
          <SaiAbout />
        </DCArtboard>
        <DCArtboard id="company" label="02 / 会社概要" width={1440} height={2800}>
          <SaiCompany />
        </DCArtboard>
        <DCArtboard id="news" label="03 / お知らせ" width={1440} height={1900}>
          <SaiNews />
        </DCArtboard>
        <DCArtboard id="partners" label="04 / パートナー" width={1440} height={1500}>
          <SaiPartners />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
