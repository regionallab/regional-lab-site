<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Regional Lab アプリ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Regional Lab 株式会社の公式アプリ。四つの事業、イベント、お知らせを、オフラインでもご覧いただけます。" />
<meta name="theme-color" content="#f1ead8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Regional Lab" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;700&family=Shippori+Mincho:wght@400;500;600&family=Noto+Serif+JP:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #f1ead8; color: #1f1a14; }
  body {
    font-family: "Zen Old Mincho", "Noto Serif JP", serif;
    line-break: strict;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
  }
  #root { min-height: 100vh; }
  * { -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; }
  img { max-width: 100%; }

  /* アプリはスマホ幅が基準。広い画面では中央に寄せて読みやすい幅に収める */
  @media (min-width: 620px) {
    #root, #ra-splash { max-width: 560px; margin: 0 auto; box-shadow: 0 0 40px rgba(31,26,20,0.10); }
    #ra-splash { left: 50%; transform: translateX(-50%); }
  }

  /* 起動時のスプラッシュ */
  #ra-splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #f1ead8; transition: opacity .5s ease;
  }
  #ra-splash img { width: 92px; height: 92px; border-radius: 46px; }
  #ra-splash .ra-splash-name {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 5px; color: #9a3324;
  }
</style>
</head>
<body>

<div id="ra-splash">
  <img src="icon-192.png" alt="Regional Lab" />
  <div class="ra-splash-name">REGIONAL LAB</div>
</div>

<div id="root"></div>

<noscript>
  <div style="padding:40px 24px; font-family:serif; line-height:2;">
    このアプリの表示には JavaScript が必要です。<a href="../index.html">Web サイトはこちら</a>。
  </div>
</noscript>

<!-- Web サイト（../index.html）と同じ URL・同じ integrity。ブラウザ／Service Worker のキャッシュを共有します -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- コンテンツは Web サイトと共有（../site-data.jsx を編集すれば両方に反映されます） -->
<script type="text/babel" src="../i18n.jsx"></script>
<script type="text/babel" src="../site-data.jsx"></script>
<script type="text/babel" src="../site-data-en.jsx"></script>

<!-- アプリ本体 -->
<script type="text/babel" src="app-core.jsx"></script>
<script type="text/babel" src="app-screens.jsx"></script>
<script type="text/babel" src="app-more.jsx"></script>
<script type="text/babel" src="app-root.jsx"></script>

<script>
  // Service Worker（オフライン表示）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('Service Worker の登録に失敗しました', e);
      });
    });
  }
</script>
</body>
</html>
