<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Regional Lab — 彩 Direction</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;600;700&family=Zen+Old+Mincho:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #c8d49d; font-family: "Inter", system-ui, sans-serif; }
  #root { width: 100%; min-height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#1f3552"/>
    <text x="300" y="220" text-anchor="middle" font-family="serif" font-size="180" fill="#f1ead8" font-weight="500">彩</text>
    <text x="300" y="290" text-anchor="middle" font-family="serif" font-size="22" fill="#9a3324" letter-spacing="6">REGIONAL LAB</text>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="variant-b-sai.jsx"></script>
<script type="text/babel" src="variant-b-pages.jsx"></script>
<script type="text/babel" src="variant-b-contact.jsx"></script>

<script type="text/babel">
const { SaiVariant, SaiNav, SaiCTA, SaiAbout, SaiCompany, SaiNews, SaiPartners, SaiContact } = window;

const PAGE_IDS = ['home', 'about', 'company', 'business', 'news', 'contact', 'partners'];

function getPageFromHash() {
  const h = (window.location.hash || '').replace('#', '');
  return PAGE_IDS.includes(h) ? h : 'home';
}

function App() {
  const [page, setPage] = React.useState(getPageFromHash());
  const [splashDone, setSplashDone] = React.useState(false);

  React.useEffect(() => {
    window.saiNavigate = (id) => {
      if (!PAGE_IDS.includes(id)) return;
      window.location.hash = id;
      setPage(id);
      window.scrollTo({ top: 0, behavior: 'auto' });
    };
    const onHash = () => setPage(getPageFromHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  React.useEffect(() => {
    const t = setTimeout(() => setSplashDone(true), 4000);
    return () => clearTimeout(t);
  }, []);

  // Sub-page renderer wraps the page content with the shared nav + footer
  function SubPage({ children }) {
    return (
      <div style={{ fontFamily: '"Shippori Mincho", serif', background: '#f1ead8' }}>
        <SaiNav />
        {children}
        <SaiCTA />
      </div>
    );
  }

  let body;
  switch (page) {
    case 'about':    body = <SubPage><SaiAbout /></SubPage>; break;
    case 'company':  body = <SubPage><SaiCompany /></SubPage>; break;
    case 'news':     body = <SubPage><SaiNews /></SubPage>; break;
    case 'partners': body = <SubPage><SaiPartners /></SubPage>; break;
    case 'contact':  body = <SubPage><SaiContact /></SubPage>; break;
    // business doesn't have a dedicated sub-page — fall through to Home
    case 'home':
    case 'business':
    default:         body = <SaiVariant />;
  }

  return (
    <React.Fragment>
      <div className="sai-app-body">
        {body}
      </div>
      {!splashDone && (
        <img
          src="assets/splash-noroshi.png"
          alt="Regional Lab"
          className="sai-splash-logo"
          style={{
            position: 'fixed', inset: 0,
            width: '100%', height: '100%',
            objectFit: 'contain', display: 'block',
            zIndex: 9999, pointerEvents: 'none',
          }}
        />
      )}
      <style>{`
        .sai-app-body { animation: saiHomeIn 4s ease-in-out forwards; }
        .sai-splash-logo { animation: saiSplashLogo 4s ease-in-out forwards; }
        @keyframes saiHomeIn {
          0%, 75% { opacity: 0; }
          100%    { opacity: 1; }
        }
        @keyframes saiSplashLogo {
          0%   { opacity: 0; }
          25%  { opacity: 1; }
          50%  { opacity: 1; }
          75%  { opacity: 0; }
          100% { opacity: 0; }
        }
      `}</style>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
