  html, body { margin: 0; padding: 0; background: #d5d492; font-family: "Inter", system-ui, sans-serif; }

  .desktop-shell { min-width: 1440px; }

  /* ---- 日本語組版：折り返し位置と行のバランス ---- */
  /* 禁則処理は全画面共通 */
  body { line-break: strict; }

  /* 文節単位の折り返し（auto-phrase）は PC 幅だけで使う。
     1行40字以上ある PC では読みやすさが上がるが、1行24字程度のスマホでは
     次の文節が入りきらず手前で折り返すため、右側が大きく余ってしまう。
     （実測：スマホ幅で行の埋まり具合が 74〜88% → 未使用時は 97〜99%）
     ブレークポイントはアプリ側のPC/スマホ切替（768px）と揃えている。 */
  @media (min-width: 769px) {
    body { word-break: auto-phrase; }
    p, li { text-wrap: pretty; }
  }
  /* ※ text-wrap: balance は使わない。Chrome では auto-phrase を無効化し、
     Safari では文節を無視して「日/本」のように語の途中で割ってしまうため。
     短い一文（理念・使命・展望など）は読点で明示的に改行している。 */
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#1f3552"/>
    <text x="300" y="220" text-anchor="middle" font-family="serif" font-size="180" fill="#f1ead8" font-weight="500">彩</text>
    <text x="300" y="290" text-anchor="middle" font-family="serif" font-size="22" fill="#9a3324" letter-spacing="6">REGIONAL LAB</text>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="site-data.jsx"></script>
<script type="text/babel" src="site-data-en.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="variant-b-sai.jsx"></script>
<script type="text/babel" src="variant-b-pages.jsx"></script>
<script type="text/babel" src="variant-b-contact.jsx"></script>
<script type="text/babel" src="business-page.jsx"></script>
<script type="text/babel" src="mobile-site.jsx"></script>

<script type="text/babel">
const { SaiVariant, SaiNav, SaiCTA, SaiAbout, SaiCompany, SaiNews, SaiPartners, SaiContact, SaiBusinessPage, MobileSite } = window;

const PAGE_IDS = ['home', 'about', 'company', 'business', 'news', 'contact', 'partners'];

function getPageFromHash() {
  const h = (window.location.hash || '').replace('#', '');
  return PAGE_IDS.includes(h) ? h : 'home';
}

function App() {
  const [page, setPage] = React.useState(getPageFromHash());
  const [splashDone, setSplashDone] = React.useState(false);
  const [isMobile, setIsMobile] = React.useState(() => window.matchMedia('(max-width: 768px)').matches);
  const [lang, setLang] = React.useState(window.saiLang || 'ja');

  React.useEffect(() => {
    window.saiNavigate = (id) => {
      if (!PAGE_IDS.includes(id)) return;
      window.location.hash = id;
      setPage(id);
      // 事業概要は専用ページがないため、ホームの「三つの柱」セクションへスクロール
      window.scrollTo({ top: 0, behavior: 'auto' });
    };
    const onHash = () => setPage(getPageFromHash());
    window.addEventListener('hashchange', onHash);
    window.saiOnLangChange = (l) => setLang(l);
    const mql = window.matchMedia('(max-width: 768px)');
    const onResize = (e) => setIsMobile(e.matches);
    mql.addEventListener('change', onResize);
    return () => {
      window.removeEventListener('hashchange', onHash);
      mql.removeEventListener('change', onResize);
    };
  }, []);

  React.useEffect(() => {
    const t = setTimeout(() => setSplashDone(true), 4000);
    return () => clearTimeout(t);
  }, []);

  // Sub-page renderer wraps the page content with the shared nav + footer
  function SubPage({ children }) {
    return (
      <div style={{ fontFamily: '"Shippori Mincho", serif', background: '#f1ead8' }}>
        <SaiNav />
        {children}
        <SaiCTA />
      </div>
    );
  }

  let body;
  if (isMobile) {
    body = <div className="mobile-shell"><MobileSite page={page} /></div>;
  } else {
    let desktopBody;
    switch (page) {
      case 'about':    desktopBody = <SubPage><SaiAbout /></SubPage>; break;
      case 'company':  desktopBody = <SubPage><SaiCompany /></SubPage>; break;
      case 'news':     desktopBody = <SubPage><SaiNews /></SubPage>; break;
      case 'partners': desktopBody = <SubPage><SaiPartners /></SubPage>; break;
      case 'contact':  desktopBody = <SubPage><SaiContact /></SubPage>; break;
      case 'business': desktopBody = <SubPage><SaiBusinessPage /></SubPage>; break;
      case 'home':
      default:         desktopBody = <SaiVariant />;
    }
    body = <div className="desktop-shell">{desktopBody}</div>;
  }

  return (
    <React.Fragment>
      <div className="sai-app-body" key={lang}>
        {body}
      </div>
      {!splashDone && (
        <img
          src="assets/splash-noroshi.png"
          alt="Regional Lab"
          className="sai-splash-logo"
          style={{
            position: 'fixed', inset: 0,
            width: '100%', height: '100%',
            objectFit: 'contain', display: 'block',
            zIndex: 9999, pointerEvents: 'none',
          }}
        />
      )}
      <style>{`
        .sai-app-body { animation: saiHomeIn 4s ease-in-out forwards; }
        .sai-splash-logo { animation: saiSplashLogo 4s ease-in-out forwards; }
        @keyframes saiHomeIn {
          0%, 75% { opacity: 0; }
          100%    { opacity: 1; }
        }
        @keyframes saiSplashLogo {
          0%   { opacity: 0; }
          25%  { opacity: 1; }
          50%  { opacity: 1; }
          75%  { opacity: 0; }
          100% { opacity: 0; }
        }
      `}</style>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
